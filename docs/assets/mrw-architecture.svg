<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
<title id="title">MRW architecture: ports, adapters and justification</title>
<desc id="desc">The VS Code facade leads to MRW's core, which contains workflow coordination, a canonical data model, the integral justification logic engine, storage integrity and usage recording. The existing bounded Lean engine checks J0 and J(CS) certificates relative to explicit admissions; the broader inference workflow remains pending. Ports and adapters connect documents and notes, sources and references, computation, external proof checking, AI assistance and optional diagnostics. Provenance, external checking and contextual justification remain distinct. Dashed elements are proposed. Diagnostic reports feed Codex review against the design before corrections.</desc>
