[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrw"
version = "0.23.11"
description = "Mathematical Research Workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "F. Lengyel" }]
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
mrw = "mrw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mrw" = ["quiver.json"]
"mrw.data" = ["*.json"]
